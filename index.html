<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Sorter AI — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-wrapper">
    <!-- Шапка приложения -->
    <header class="app-header">
      <div class="header-top">
        <h2>Smart Sorter AI 📱</h2>
        <span class="status-online">Online</span>
      </div>
      <p class="subtitle">Дашборд автоматической сортировки писем и сообщений</p>
    </header>

    <!-- Переключатель категорий важности -->
    <nav class="filter-tabs">
      <button class="tab-btn active" onclick="filterEmails('all')">Все</button>
      <button class="tab-btn priority-high" onclick="filterEmails('high')">1-я важность 🔴</button>
      <button class="tab-btn priority-medium" onclick="filterEmails('medium')">2-я важность 🟡</button>
      <button class="tab-btn priority-low" onclick="filterEmails('low')">Низкая 🟢</button>
    </nav>

    <!-- Панель симуляции входящего письма -->
    <section class="card incoming-sim">
      <h3>Симуляция входящего сообщения (Gmail/WhatsApp)</h3>
      <div class="form-group">
        <input type="text" id="sender" placeholder="От кого (например: Turan Admission)">
      </div>
      <div class="form-group">
        <input type="text" id="subject" placeholder="Тема сообщения (например: Scholarship info)">
      </div>
      <div class="form-group">
        <textarea id="body" rows="2" placeholder="Текст письма..."></textarea>
      </div>
      <button id="receiveBtn" onclick="processIncomingEmail()">Получить и отсортировать письмо</button>
    </section>

    <!-- Список отсортированных писем -->
    <main class="card dashboard-list">
      <h3>Входящие сообщения</h3>
      <div id="emailContainer" class="email-container">
        <!-- Сюда динамически добавляются отсортированные письма -->
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
