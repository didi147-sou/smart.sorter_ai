<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Email Sorter AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h2>Smart Email Sorter AI 🤖✉️</h2>
      <p class="subtitle">Автоматический анализ важности сообщений</p>
    </header>

    <div class="main-content">
      <!-- Форма отправки -->
      <section class="card">
        <h3>Отправить сообщение</h3>
        <form id="contactForm">
          <div class="form-group">
            <label for="to">Email получателя</label>
            <input type="email" id="to" name="to" required placeholder="example@gmail.com">
          </div>

          <div class="form-group">
            <label for="subject">Тема письма</label>
            <input type="text" id="subject" name="subject" required placeholder="Введите тему...">
          </div>

          <div class="form-group">
            <label for="body">Текст сообщения</label>
            <textarea id="body" name="body" rows="4" required placeholder="Напишите текст... Алгоритм сам определит важность."></textarea>
          </div>

          <button type="submit" id="submitBtn">Анализировать и отправить</button>
        </form>
        <div id="status" class="status-message"></div>
      </section>

      <!-- Панель отсортированных писем -->
      <section class="card">
        <h3>Журнал отсортированных писем</h3>
        <div id="emailList" class="email-list">
          <p class="empty-text">Отправленные и отсортированные письма появятся здесь...</p>
        </div>
      </section>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
