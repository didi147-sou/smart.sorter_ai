<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отправка почты через Google Apps Script</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Связаться с нами</h2>
    <form id="contactForm">
      <div class="form-group">
        <label for="to">Email получателя</label>
        <input type="email" id="to" name="to" required placeholder="example@gmail.com">
      </div>

      <div class="form-group">
        <label for="subject">Тема письма</label>
        <input type="text" id="subject" name="subject" required placeholder="Тема сообщения">
      </div>

      <div class="form-group">
        <label for="body">Сообщение</label>
        <textarea id="body" name="body" rows="4" required placeholder="Введите ваш текст..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Отправить</button>
    </form>

    <div id="status" class="status-message"></div>
  </div>

  <!-- Подключаем конфиг и основной скрипт -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
